<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: Охрана труда</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF5722;
    --orange-light: #FF7043;
    --orange-dim: rgba(255,87,34,0.12);
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #1e1e28;
    --border: rgba(255,255,255,0.07);
    --text: #f0ede8;
    --muted: #7a7a8c;
    --correct: #22c55e;
    --wrong: #ef4444;
    --correct-dim: rgba(34,197,94,0.12);
    --wrong-dim: rgba(239,68,68,0.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Onest', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG TEXTURE */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 80% 10%, rgba(255,87,34,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 10% 80%, rgba(255,87,34,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    width: 44px; height: 44px;
    background: var(--orange);
    border-radius: 12px;
    display: grid; place-items: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 900; font-size: 18px;
    color: #fff; flex-shrink: 0;
    box-shadow: 0 0 20px rgba(255,87,34,0.4);
  }
  .header-title h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: 16px; font-weight: 600;
    letter-spacing: -0.3px;
  }
  .header-title p { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .timer-badge {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 18px;
    font-family: 'Unbounded', sans-serif;
    font-size: 18px; font-weight: 700;
    color: var(--orange);
    letter-spacing: 1px;
    min-width: 90px; text-align: center;
    transition: color 0.3s;
  }
  .timer-badge.urgent { color: var(--wrong); animation: pulse-timer 1s infinite; }
  @keyframes pulse-timer { 0%,100%{opacity:1} 50%{opacity:0.6} }

  /* ── NAVIGATION ── */
  .nav-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 24px;
    margin-bottom: 28px;
  }
  .nav-label {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin-bottom: 14px;
  }
  .nav-dots {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .nav-dot {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Unbounded', sans-serif;
    font-size: 11px; font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .nav-dot:hover { border-color: var(--orange); color: var(--orange); }
  .nav-dot.active { background: var(--orange); border-color: var(--orange); color: #fff; box-shadow: 0 0 12px rgba(255,87,34,0.45); }
  .nav-dot.answered { border-color: var(--correct); color: var(--correct); }
  .nav-dot.answered::after {
    content: ''; position: absolute; bottom: 1px; right: 1px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--correct);
  }
  .nav-dot.active.answered { background: var(--orange); border-color: var(--orange); color: #fff; }

  /* ── QUESTION CARD ── */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 20px;
    animation: slide-in 0.35s cubic-bezier(.22,.68,0,1.2);
  }
  @keyframes slide-in {
    from { opacity:0; transform: translateY(20px) scale(0.98); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }
  .question-header {
    display: flex; align-items: flex-start; gap: 20px;
    padding: 28px 28px 24px;
    border-bottom: 1px solid var(--border);
  }
  .q-num {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--orange);
    background: var(--orange-dim);
    border-radius: 8px; padding: 5px 12px;
    white-space: nowrap; flex-shrink: 0; margin-top: 2px;
  }
  .q-text { font-size: 17px; line-height: 1.55; font-weight: 400; }

  /* ── OPTIONS ── */
  .options { padding: 20px 28px 28px; display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 18px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .option:hover:not(.locked) { border-color: var(--orange); background: var(--orange-dim); }
  .option.selected:not(.locked) { border-color: var(--orange); background: var(--orange-dim); }
  .option.correct { border-color: var(--correct); background: var(--correct-dim); }
  .option.wrong   { border-color: var(--wrong);   background: var(--wrong-dim); }
  .option.locked  { cursor: default; }

  .opt-letter {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid currentColor;
    display: grid; place-items: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 11px; font-weight: 700;
    color: var(--muted);
    flex-shrink: 0; transition: all 0.2s;
  }
  .option.selected:not(.locked) .opt-letter { color: var(--orange); border-color: var(--orange); }
  .option.selected:not(.locked) .opt-letter::after,
  .option.correct .opt-letter::after {
    content: ''; display: block;
    width: 10px; height: 10px; border-radius: 50%;
    background: currentColor;
  }
  .option.correct .opt-letter { color: var(--correct); border-color: var(--correct); }
  .option.wrong   .opt-letter { color: var(--wrong);   border-color: var(--wrong);   }
  .option.wrong   .opt-letter::after { content: '✕'; font-size: 9px; background: none; }

  .opt-text { font-size: 15px; line-height: 1.4; }

  /* ── FOOTER BAR ── */
  .footer-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .progress-info { font-size: 13px; color: var(--muted); }
  .progress-info b { color: var(--text); }
  .btn {
    font-family: 'Unbounded', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
    padding: 14px 28px; border-radius: 12px; border: none;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-outline {
    background: transparent; color: var(--muted);
    border: 1.5px solid var(--border);
  }
  .btn-outline:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .btn-primary {
    background: var(--orange); color: #fff;
    box-shadow: 0 0 20px rgba(255,87,34,0.35);
  }
  .btn-primary:hover { background: var(--orange-light); box-shadow: 0 0 28px rgba(255,87,34,0.5); transform: translateY(-1px); }
  .btn-danger {
    background: transparent; color: var(--wrong);
    border: 1.5px solid rgba(239,68,68,0.3);
  }
  .btn-danger:hover { background: var(--wrong-dim); }

  /* ── RESULT SCREEN ── */
  .result-screen {
    text-align: center; padding: 60px 20px;
    animation: slide-in 0.4s ease;
  }
  .result-circle {
    width: 140px; height: 140px; border-radius: 50%;
    margin: 0 auto 32px;
    display: grid; place-items: center;
    position: relative;
  }
  .result-circle svg { position: absolute; inset:0; width:100%; height:100%; transform: rotate(-90deg); }
  .result-circle circle { fill:none; stroke-width:6; }
  .result-circle .track { stroke: var(--surface2); }
  .result-circle .fill  { stroke: var(--orange); stroke-linecap: round; transition: stroke-dashoffset 1.2s ease; }
  .result-pct {
    font-family: 'Unbounded', sans-serif;
    font-size: 36px; font-weight: 900; color: var(--orange);
    position: relative; z-index: 1;
  }
  .result-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 26px; font-weight: 700; margin-bottom: 10px;
  }
  .result-sub { color: var(--muted); font-size: 15px; margin-bottom: 40px; }
  .result-stats {
    display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 40px;
  }
  .stat-pill {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 28px; min-width: 130px;
  }
  .stat-num { font-family: 'Unbounded', sans-serif; font-size: 28px; font-weight: 900; }
  .stat-num.c  { color: var(--correct); }
  .stat-num.w  { color: var(--wrong); }
  .stat-num.sk { color: var(--muted); }
  .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ── REVIEW ── */
  .review-section { margin-top: 40px; text-align: left; }
  .review-title {
    font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .review-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 10px;
  }
  .review-item .ri-q { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
  .review-item .ri-answers { display: flex; flex-direction: column; gap: 5px; }
  .ri-ans {
    font-size: 13px; color: var(--muted);
    padding: 6px 12px; border-radius: 8px;
    border: 1px solid transparent;
  }
  .ri-ans.correct { color: var(--correct); background: var(--correct-dim); border-color: rgba(34,197,94,0.2); }
  .ri-ans.wrong   { color: var(--wrong);   background: var(--wrong-dim);   border-color: rgba(239,68,68,0.2); }

  /* ── PROGRESS BAR ── */
  .progress-bar-wrap { margin-bottom: 18px; }
  .progress-bar-track {
    height: 4px; background: var(--surface2); border-radius: 99px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--orange) 0%, var(--orange-light) 100%);
    border-radius: 99px; transition: width 0.4s ease;
  }

  /* ── CONFIRM MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: grid; place-items: center; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 36px 32px; max-width: 400px; width: 90%;
    transform: scale(0.95); transition: transform 0.2s;
    text-align: center;
  }
  .modal-overlay.show .modal-box { transform: scale(1); }
  .modal-icon { font-size: 48px; margin-bottom: 16px; }
  .modal-box h2 { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .modal-box p  { color: var(--muted); font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
  .modal-btns   { display: flex; gap: 10px; justify-content: center; }

  /* responsive */
  @media (max-width:600px) {
    .question-header { padding: 20px; flex-direction: column; gap: 10px; }
    .options { padding: 14px 20px 20px; }
    .footer-bar { flex-direction: column; align-items: stretch; }
    .footer-bar .btn { text-align: center; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>
    <h2>Завершить тест?</h2>
    <p>Вы ответили не на все вопросы. Пропущенные вопросы будут засчитаны как неверные.</p>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="finishTest()">Завершить</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="logo-mark">OT</div>
    <div class="header-title">
      <h1>Охрана труда</h1>
      <p>Промежуточная аттестация</p>
    </div>
    <div class="timer-badge" id="timer">20:00</div>
  </header>

  <!-- MAIN CONTENT -->
  <div id="app"></div>
</div>

<script>
// ══════════════════════════════════════════
//   БАЗА ВОПРОСОВ (JSON)
// ══════════════════════════════════════════
const QUESTIONS = [

    options: [

      "Технические средства, применяемые для защиты одного работника",

    ],

  },
  {
    id: 6,
    text: "Что должен сделать работник при обнаружении неисправности оборудования?",
    options: [
      "Продолжить работу, соблюдая осторожность",
      "Самостоятельно устранить неисправность",
      "Прекратить работу и сообщить руководителю",
      "Переключиться на другой вид работ"
    ],
    answer: 2
  },
  {
    id: 7,
    text: "Производственная травма – это...",
    options: [
      "Любое заболевание, полученное на работе",

      "Хроническое заболевание, вызванное условиями труда",

    ],
    answer: 1
  },
  {

    options: [
      "Освещённость, шум, вибрация",

      "Запылённость, загазованность, радиация",

    ],
    answer: 1
  },
  {
    id: 9,
    text: "Огнетушитель класса «A» предназначен для тушения...",
    options: [
      "Электроустановок под напряжением",

    ],
    answer: 2
  },
  {
    id: 10,
    text: "При поражении электрическим током первым действием является...",

    answer: 2

  {

    options: ["Ежегодно", "Не реже одного раза в 5 лет", "Один раз при открытии организации", "Каждые 10 лет"],
    answer: 1
  },
  {

  {

  },

    answer: 1
  },
  {
    id: 18,
    text: "Работник вправе отказаться от выполнения работ в случае...",
    options: [
      "Несогласия с зарплатой",
      "Возникновения опасности для его жизни и здоровья",
      "Плохих погодных условий",

    ],
    answer: 1
  },
  {

    text: "Производственный контроль за соблюдением санитарных правил осуществляется...",
    options: [
      "Только государственными органами",

      "Профсоюзным комитетом"
    ],
    answer: 2
  },
  {
    id: 20,
    text: "Виброзащитные перчатки относятся к СИЗ...",
    options: ["Органов зрения", "Органов слуха", "Рук", "Органов дыхания"],
    answer: 2
  }
];

// ══════════════════════════════════════════
//   STATE
// ══════════════════════════════════════════
const TOTAL = QUESTIONS.length;
const TIME_LIMIT = 20 * 60; // секунд

let current   = 0;
let answers   = new Array(TOTAL).fill(null);
let finished  = false;
let startTime = Date.now();
let timerInterval;

// ══════════════════════════════════════════
//   TIMER
// ══════════════════════════════════════════
function startTimer() {
  const el = document.getElementById('timer');
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const left    = Math.max(0, TIME_LIMIT - elapsed);
    const m = String(Math.floor(left / 60)).padStart(2,'0');
    const s = String(left % 60).padStart(2,'0');
    el.textContent = `${m}:${s}`;
    el.classList.toggle('urgent', left <= 60);
    if (left === 0) { clearInterval(timerInterval); finishTest(); }
  }, 500);
}

// ══════════════════════════════════════════
//   RENDER
// ══════════════════════════════════════════
function render() {
  if (finished) { renderResult(); return; }
  renderQuiz();
}

function renderQuiz() {
  const q = QUESTIONS[current];
  const letters = ['a','b','c','d','e','f'];
  const answered = answers.filter(a => a !== null).length;
  const pct = answered / TOTAL * 100;

  document.getElementById('app').innerHTML = `
    <!-- NAV -->
    <div class="nav-card">
      <div class="nav-label">Навигация по тесту</div>
      <div class="nav-dots">
        ${QUESTIONS.map((_, i) => `
          <button class="nav-dot ${i===current?'active':''} ${answers[i]!==null?'answered':''}"
            onclick="goTo(${i})">${i+1}</button>
        `).join('')}
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-bar-wrap">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${pct}%"></div>
      </div>
    </div>

    <!-- QUESTION -->
    <div class="question-card">
      <div class="question-header">
        <div class="q-num">Вопрос ${current + 1}</div>
        <div class="q-text">${q.text}</div>
      </div>
      <div class="options">
        ${q.options.map((opt, i) => `
          <div class="option ${answers[current]===i?'selected':''}"
            onclick="selectAnswer(${i})">
            <div class="opt-letter">${letters[i]}</div>
            <div class="opt-text">${opt}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-bar">
      <div class="progress-info">Отвечено: <b>${answered}</b> из <b>${TOTAL}</b></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${current > 0 ? `<button class="btn btn-outline" onclick="goTo(${current-1})">← Назад</button>` : ''}
        ${current < TOTAL-1
          ? `<button class="btn btn-primary" onclick="goTo(${current+1})">Следующий →</button>`
          : `<button class="btn btn-primary" onclick="confirmFinish()">Завершить тест ✓</button>`
        }
        <button class="btn btn-danger" onclick="confirmFinish()">Закончить попытку</button>
      </div>
    </div>
  `;
}

function renderResult() {
  clearInterval(timerInterval);
  document.getElementById('timer').style.display = 'none';

  let correct = 0, wrong = 0, skipped = 0;
  QUESTIONS.forEach((q, i) => {
    if (answers[i] === null) skipped++;
    else if (answers[i] === q.answer) correct++;
    else wrong++;
  });

  const pct = Math.round(correct / TOTAL * 100);
  const passed = pct >= 60;

  // circle math
  const r = 58, circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;

  const reviewHTML = QUESTIONS.map((q, i) => {
    const letters = ['a','b','c','d','e','f'];
    const userAns = answers[i];
    return `
      <div class="review-item">
        <div class="ri-q"><b>Вопрос ${i+1}.</b> ${q.text}</div>
        <div class="ri-answers">
          ${q.options.map((opt, j) => {
            let cls = '';
            if (j === q.answer) cls = 'correct';
            else if (j === userAns && userAns !== q.answer) cls = 'wrong';
            return `<div class="ri-ans ${cls}">${letters[j]}. ${opt}${j===q.answer?' ✓':j===userAns?' ✗':''}</div>`;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="result-screen">
      <div class="result-circle">
        <svg viewBox="0 0 130 130">
          <circle class="track" cx="65" cy="65" r="${r}" />
          <circle class="fill" cx="65" cy="65" r="${r}"
            stroke-dasharray="${circ}"
            stroke-dashoffset="${circ}" id="fillCircle"/>
        </svg>
        <div class="result-pct" id="pctNum">0%</div>
      </div>

      <h2 class="result-title">${passed ? '🎉 Тест пройден!' : '😔 Тест не пройден'}</h2>
      <p class="result-sub">${passed ? 'Отличный результат! Вы успешно справились с заданием.' : 'Наберите не менее 60% для успешной сдачи. Попробуйте ещё раз!'}</p>

      <div class="result-stats">
        <div class="stat-pill">
          <div class="stat-num c">${correct}</div>
          <div class="stat-lbl">Правильных</div>
        </div>
        <div class="stat-pill">
          <div class="stat-num w">${wrong}</div>
          <div class="stat-lbl">Неверных</div>
        </div>
        <div class="stat-pill">
          <div class="stat-num sk">${skipped}</div>
          <div class="stat-lbl">Пропущено</div>
        </div>
      </div>

      <button class="btn btn-primary" onclick="restartTest()">Пройти заново</button>

      <div class="review-section">
        <div class="review-title">Разбор ответов</div>
        ${reviewHTML}
      </div>
    </div>
  `;

  // animate circle & counter
  setTimeout(() => {
    const fillEl = document.getElementById('fillCircle');
    const numEl  = document.getElementById('pctNum');
    if (!fillEl || !numEl) return;
    fillEl.style.transition = 'stroke-dashoffset 1.2s ease';
    fillEl.style.strokeDashoffset = circ - dash;
    let count = 0;
    const step = pct / 60;
    const iv = setInterval(() => {
      count = Math.min(count + step, pct);
      numEl.textContent = Math.round(count) + '%';
      if (count >= pct) clearInterval(iv);
    }, 16);
  }, 100);
}

// ══════════════════════════════════════════
//   ACTIONS
// ══════════════════════════════════════════
function selectAnswer(idx) {
  if (finished) return;
  answers[current] = idx;
  render();
}

function goTo(idx) {
  if (idx < 0 || idx >= TOTAL) return;
  current = idx;
  render();
}

function confirmFinish() {
  const unanswered = answers.filter(a => a === null).length;
  if (unanswered > 0) {
    document.getElementById('modal').classList.add('show');
  } else {
    finishTest();
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function finishTest() {
  closeModal();
  finished = true;
  render();
}

function restartTest() {
  current   = 0;
  answers   = new Array(TOTAL).fill(null);
  finished  = false;
  startTime = Date.now();
  document.getElementById('timer').style.display = '';
  startTimer();
  render();
}

// ══════════════════════════════════════════
//   INIT
// ══════════════════════════════════════════
startTimer();
render();
</script>
</body>
</html>
