<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тесты</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== ЗАЩИТА ПАРОЛЕМ ===== -->
  <div id="password-screen">
    <div class="password-overlay">
      <div class="password-box">
        <div class="logo-mark" style="margin: 0 auto 28px; width: 72px; height: 72px; font-size: 28px;">OT</div>
        
        <h2>Доступ к тесту</h2>
        <p style="color: var(--muted); margin-bottom: 32px;">Введите пароль для продолжения</p>

        <input 
          type="password" 
          id="pass-input" 
          placeholder="Введите пароль"
          autocomplete="off"
          onkeypress="if(event.key === 'Enter') checkPassword()"
        >

        <button onclick="checkPassword()">Войти</button>

        <p id="error-msg" class="error"></p>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-icon">⚠️</div>
      <h2>Завершить тест?</h2>
      <p>Вы ответили не на все вопросы. Пропущенные вопросы будут засчитаны как неверные.</p>
      <div class="modal-btns">
        <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="finishTest()">Завершить</button>
      </div>
    </div>
  </div>

  <!-- ОСНОВНОЙ LAYOUT -->
  <div class="wrap">
    <header>
      <div onclick="showTestSelection()" style="display:flex; align-items:center; gap:16px; cursor:pointer;">
        <div class="logo-mark">КХЦ</div>
        <div class="header-title">
          <h1>Тесты КХЦ</h1>
          <p id="test-type">Пробное тестирование</p>
        </div>
      </div>
      <div class="timer-badge" id="timer">2:00:00</div>
    </header>

    <div id="app"></div>
  </div>

  <script>
    const CORRECT_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; // SHA-256 от "admin"

    async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkPassword() {
    const input = document.getElementById('pass-input').value.trim();
    const errorMsg = document.getElementById('error-msg');

    if (!input) {
      errorMsg.textContent = "Введите пароль";
      return;
    }

    const inputHash = await sha256(input);

    if (inputHash === CORRECT_HASH || input.toLowerCase() === "admin") {
      document.getElementById('password-screen').style.display = 'none';
      localStorage.setItem('ot_test_access', 'granted');

      // Запускаем главный экран выбора теста
      let script = document.createElement('script');
      script.scr = "quiz.js"
      document.head.append(script);

    } else {
      errorMsg.textContent = "Неверный пароль";
      document.getElementById('pass-input').value = '';
      document.getElementById('pass-input').focus();
    }
    }

    // Автоматический вход, если пароль уже был введён ранее
    if (localStorage.getItem('ot_test_access') === 'granted') {
      const passScreen = document.getElementById('password-screen');
    if (passScreen) passScreen.style.display = 'none';
    }
  </script>
</body>
</html>
