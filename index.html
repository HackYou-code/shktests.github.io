<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест: Охрана труда</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-icon">⚠️</div>
      <h2>Завершить тест?</h2>
      <p>Вы ответили не на все вопросы. Пропущенные вопросы будут засчитаны как неверные.</p>
      <div class="modal-btns">
        <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="finishTest()">Завершить</button>
      </div>
    </div>
  </div>

  <!-- ОСНОВНОЙ LAYOUT -->
  <div class="wrap">
    <header>
      <div class="logo-mark">OT</div>
      <div class="header-title">
        <h1>Охрана труда</h1>
        <p>Промежуточная аттестация</p>
      </div>
      <div class="timer-badge" id="timer">20:00</div>
    </header>

    <!-- Контент рендерится через JavaScript -->
    <div id="app"></div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
